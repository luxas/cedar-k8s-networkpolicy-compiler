# The Istio Bookinfo sample, cut down to the productpage -> details hop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: details-allow-productpage
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: details
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: productpage
      ports:
        - protocol: TCP
          port: 9080
