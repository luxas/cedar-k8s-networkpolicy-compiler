name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The symbolic tests (tests/symbolic.rs) drive cvc5 and fail loudly without
      # it, by design — in EVERY job that runs cargo test.
      - name: Install cvc5
        run: |
          curl -fsSL -o /tmp/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
          unzip -q /tmp/cvc5.zip -d /tmp
          echo "CVC5=/tmp/cvc5-Linux-x86_64-static/bin/cvc5" >> "$GITHUB_ENV"

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

      # The offline compiler must keep building without the Kubernetes client, so
      # that anyone embedding it does not inherit an HTTP and TLS stack.
      - run: cargo test --no-default-features

  integration:
    name: Integration (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # cargo test --features integration also runs the cvc5-loud symbolic suite;
      # see the Test job's step of the same name.
      - name: Install cvc5
        run: |
          curl -fsSL -o /tmp/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
          unzip -q /tmp/cvc5.zip -d /tmp
          echo "CVC5=/tmp/cvc5-Linux-x86_64-static/bin/cvc5" >> "$GITHUB_ENV"

      # The same scripts a developer runs, so a green build here means those
      # scripts actually work rather than that CI has its own private recipe.
      - name: Create the kind cluster and apply the fixture
        run: ./hack/kind-up.sh

      - name: Live-cluster tests
        run: cargo test --features integration
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config

      - name: Cluster state on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          kubectl get pods -A -o wide || true
          kubectl get networkpolicies -A -o yaml || true

      - name: Tear down
        if: always()
        run: ./hack/kind-down.sh

  e2e:
    name: Empirical (Cilium + kubesonde)
    runs-on: ubuntu-latest
    # Slower than the others: a cluster with no CNI, then Cilium, then kubesonde
    # probing every pod pair with nmap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # cargo test --features e2e also runs the cvc5-loud symbolic suite;
      # see the Test job's step of the same name.
      - name: Install cvc5
        run: |
          curl -fsSL -o /tmp/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
          unzip -q /tmp/cvc5.zip -d /tmp
          echo "CVC5=/tmp/cvc5-Linux-x86_64-static/bin/cvc5" >> "$GITHUB_ENV"

      - name: Create the Cilium cluster and probe the fixture
        run: ./hack/e2e-up.sh

      - name: Compare the observed connectivity with the static analysis
        run: cargo test --features e2e
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/e2e-config

      # A red empirical run is useless without knowing what the cluster was doing.
      - name: Cluster state on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/e2e-config
        run: |
          ./.bin/cilium status || true
          kubectl get pods -A -o wide || true
          kubectl get networkpolicies -A -o yaml || true
          kubectl -n np2cedar-e2e get kubesonde -o yaml || true
          kubectl -n kubesonde-system logs deployment/kubesonde-controller-manager --tail=200 || true
          echo "--- probes.json ---"
          cat .e2e/probes.json || true

      - name: Tear down
        if: always()
        run: ./hack/e2e-down.sh
