[package]
name = "k8s-networkpolicy-smt"
version = "0.1.0"
edition = "2024"

# The docs and every example call this np2cedar; make the binary match.
[[bin]]
name = "np2cedar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
cedar-policy = { version = "4.12.0", features = ["tpe"] }
clap = { version = "4.6.6", features = ["derive"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yaml_serde = "0.10.7"

[dev-dependencies]
insta = "1.48.0"
