# The same ipBlock rule as `ipblock-egress`, but one destination has no
# status.podIPs, so its address is unknown and the rule cannot be decided.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-to-internet
  namespace: default
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8]
---
apiVersion: v1
kind: Pod
metadata: {name: gateway, namespace: default, labels: {app: gateway}}
status:
  podIPs: [{ip: 10.244.0.5}]
---
apiVersion: v1
kind: Pod
metadata: {name: known, namespace: default, labels: {app: known}}
status:
  podIPs: [{ip: 172.16.0.9}]
---
apiVersion: v1
kind: Pod
metadata: {name: mystery, namespace: default, labels: {app: mystery}}
