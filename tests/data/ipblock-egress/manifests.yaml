apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-to-internet
  namespace: default
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8]
---
apiVersion: v1
kind: Pod
metadata: {name: gateway, namespace: default, labels: {app: gateway}}
status:
  podIPs: [{ip: 10.244.0.5}]
---
# Inside the excepted range.
apiVersion: v1
kind: Pod
metadata: {name: internal, namespace: default, labels: {app: internal}}
status:
  podIPs: [{ip: 10.5.0.1}]
---
# Inside the CIDR but outside the exception.
apiVersion: v1
kind: Pod
metadata: {name: elsewhere, namespace: default, labels: {app: elsewhere}}
status:
  podIPs: [{ip: 172.16.0.9}]
